<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Calden</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="auth" class="auth-shell">
  <main class="auth-card">
    <img class="brand-logo" src="/calden-logo.svg" alt="CalDen">
    <p>Your family calendar.</p>
    <form id="setup-form" class="stack hidden">
      <h1>Set up your family calendar</h1>
      <label>Your name<input name="display_name" autocomplete="name" required></label>
      <label>Username<input name="username" autocomplete="username" required minlength="3"></label>
      <label>Password<input name="password" type="password" autocomplete="new-password" required minlength="8"></label>
      <button type="submit">Create my account</button>
    </form>
    <form id="login-form" class="stack hidden">
      <h1>Welcome back</h1>
      <label>Username<input name="username" autocomplete="username" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Sign in</button>
    </form>
    <p id="auth-error" class="error"></p>
  </main>
</div>

<div id="app" class="app hidden">
  <header class="topbar">
    <img class="brand-logo" src="/calden-logo.svg" alt="CalDen">
    <div class="top-actions"><button id="manage" class="quiet hidden">Manage</button><span id="me"></span><button id="logout" class="quiet">Sign out</button></div>
  </header>
  <main class="page">
    <section class="hero">
      <div><p class="eyebrow" id="today-label"></p><h1>Today</h1></div>
      <button id="new-event">+ Add event</button>
    </section>
    <section id="calendar-strip" class="calendar-strip"></section>
    <section>
      <div class="section-title"><h2>Coming up</h2><span id="event-count"></span></div>
      <div id="events" class="events"></div>
    </section>
  </main>
  <nav class="bottom-nav">
    <button class="active">Today</button><button>Calendar</button><button id="nav-add">Add</button><button>Notifications</button><button id="nav-more">More</button>
  </nav>
</div>

<dialog id="event-dialog">
  <form id="event-form" class="stack">
    <div class="dialog-head"><h2>Add event</h2><button type="button" class="icon-button" data-close-event>×</button></div>
    <label>What?<input name="title" required maxlength="200" placeholder="Electric bill"></label>
    <label>Calendar<select name="calendar_id" id="calendar-select" required></select></label>
    <div class="two"><label>Starts<input name="starts_at" type="datetime-local" required></label><label>Ends<input name="ends_at" type="datetime-local" required></label></div>
    <fieldset><legend>Who is this for?</legend><div id="people-picker" class="people-picker"></div></fieldset>
    <label>Where?<input name="location" maxlength="500" placeholder="Optional"></label>
    <label>Notes<textarea name="notes" rows="3" maxlength="5000" placeholder="Optional"></textarea></label>
    <label>Phone reminder
      <select name="personal_reminder"><option value="">None</option><option value="10">10 minutes before</option><option value="30">30 minutes before</option><option value="60">1 hour before</option><option value="1440">1 day before</option></select>
    </label>
    <div class="dialog-actions"><button type="button" class="quiet" data-close-event>Cancel</button><button type="submit">Save event</button></div>
    <p id="event-error" class="error"></p>
  </form>
</dialog>

<dialog id="manage-dialog">
  <div class="manage-shell">
    <div class="dialog-head"><div><p class="eyebrow">Family settings</p><h2>Manage Calden</h2></div><button type="button" class="icon-button" data-close-manage>×</button></div>
    <div class="manage-grid">
      <section>
        <h3>People</h3>
        <div id="people-list" class="simple-list"></div>
        <form id="person-form" class="stack compact">
          <h4>Add a person</h4>
          <label>Name<input name="display_name" required maxlength="100"></label>
          <label>Username<input name="username" required minlength="3" maxlength="50"></label>
          <label>Temporary password<input name="password" type="password" required minlength="8"></label>
          <label>Account type<select name="role"><option value="member">Family member</option><option value="restricted">Restricted member</option><option value="admin">Administrator</option></select></label>
          <button type="submit">Add person</button><p id="person-error" class="error"></p>
        </form>
      </section>
      <section>
        <h3>Calendars</h3>
        <div id="calendar-list" class="simple-list"></div>
        <form id="calendar-form" class="stack compact">
          <h4>Add a calendar</h4>
          <label>Name<input name="name" required maxlength="100" placeholder="Bills"></label>
          <label>Color<input name="color" type="color" value="#2f6fed" required></label>
          <label>Description<input name="description" maxlength="500" placeholder="Optional"></label>
          <fieldset><legend>Who can see it?</legend><div id="calendar-viewers" class="check-list"></div></fieldset>
          <fieldset><legend>Who can make changes?</legend><div id="calendar-editors" class="check-list"></div></fieldset>
          <button type="submit">Create calendar</button><p id="calendar-error" class="error"></p>
        </form>
      </section>
    </div>
  </div>
</dialog>
<script src="/app.js" defer></script>
</body>
</html>
