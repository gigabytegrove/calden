name: calden-alpha

# v1.5.0-alpha.2: completely separate Compose project, PostgreSQL database,
# credentials and application data from an installed stable Calden.
# NEVER reuse stable named volumes or an external production database.
services:
  secrets:
    image: alpine:3.22
    restart: "no"
    environment:
      CALDEN_DB_PASSWORD: ${CALDEN_ALPHA_DB_PASSWORD:-}
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        mkdir -p /run/calden-secrets
        if [ ! -s /run/calden-secrets/db-password ]; then
          if [ -n "$$CALDEN_DB_PASSWORD" ]; then
            printf '%s' "$$CALDEN_DB_PASSWORD" > /run/calden-secrets/db-password
          else
            head -c 48 /dev/urandom | base64 | tr -d '\n' > /run/calden-secrets/db-password
          fi
        fi
        chmod 0444 /run/calden-secrets/db-password
    volumes:
      - calden-secrets:/run/calden-secrets

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      secrets:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: calden_alpha
      POSTGRES_USER: calden_alpha
      POSTGRES_PASSWORD_FILE: /run/calden-secrets/db-password
    volumes:
      - calden-db:/var/lib/postgresql/data
      - calden-secrets:/run/calden-secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calden_alpha -d calden_alpha"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  calden:
    build:
      context: .
      args:
        CALDEN_RUN_TESTS: "1"
    restart: unless-stopped
    depends_on:
      secrets:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      CALDEN_PORT: 8787
      CALDEN_DB_HOST: db
      CALDEN_DB_PORT: 5432
      CALDEN_DB_NAME: calden_alpha
      CALDEN_DB_USER: calden_alpha
      CALDEN_DB_PASSWORD_FILE: /run/calden-secrets/db-password
      CALDEN_DB_SSLMODE: disable
      CALDEN_DATA_DIR: /data
    ports:
      - "${CALDEN_ALPHA_PORT:-18787}:8787"
    volumes:
      - calden-data:/data
      - calden-secrets:/run/calden-secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8787/api/health | grep -q '\"ok\":true'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  calden-db:
  calden-data:
  calden-secrets:
