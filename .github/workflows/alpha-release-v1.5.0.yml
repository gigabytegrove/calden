name: Publish Calden 1.5.0 Alpha Four UI And Integration One-Time

# Temporary single-version release build; does not change stable publishing.
# It only runs on this alpha branch when THIS workflow is introduced/edited.
on:
  push:
    branches:
      - alpha/v1.5.0-alpha.4
    paths:
      - .github/workflows/alpha-release-v1.5.0.yml
      - web/**
      - tests/**
      - VERSION
      - cmd/**

permissions:
  contents: write

concurrency:
  group: calden-v1.5.0-alpha.4-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact alpha revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate version and target branch
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = "alpha/v1.5.0-alpha.4"
          test "$(tr -d '[:space:]' < VERSION)" = "1.5.0-alpha.4"

      - name: Set up Go 1.24 from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build web assets and run full Node test suite
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-audit --no-fund
          npm run build:css
          npm run test:web
          node --check web/app.js
          node --check web/family-care.js
          test -s web/styles.css
          grep -Fq 'name="calden-version" content="1.5.0-alpha.4"' web/index.html

      - name: Run Go test suite
        shell: bash
        run: |
          set -Eeuo pipefail
          go test ./...

      - name: Build updater runtimes for Linux AMD64 and ARM64
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          for ARCH in amd64 arm64; do
            WORK="stage/$ARCH"
            mkdir -p "$WORK"
            CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" go build -trimpath \
              -ldflags="-s -w -X main.version=1.5.0-alpha.4" \
              -o "$WORK/calden" ./cmd/calden
            chmod 0755 "$WORK/calden"
            cp -a web "$WORK/web"
            (cd "$WORK" && tar -czf "../../dist/calden-linux-$ARCH.tar.gz" calden web)
            tar -tzf "dist/calden-linux-$ARCH.tar.gz" > "dist/archive-$ARCH.contents"
            grep -Fxq 'calden' "dist/archive-$ARCH.contents"
            grep -Fxq 'web/index.html' "dist/archive-$ARCH.contents"
            grep -Fxq 'web/styles.css' "dist/archive-$ARCH.contents"
          done
          (cd dist && sha256sum calden-linux-amd64.tar.gz calden-linux-arm64.tar.gz > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Publish tagged prerelease with updater assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG="v1.5.0-alpha.4"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Refusing to overwrite."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Refusing to retag."
            exit 1
          fi
          gh release create "$TAG" \
            dist/calden-linux-amd64.tar.gz \
            dist/calden-linux-arm64.tar.gz \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Calden 1.5.0-alpha.4" \
            --notes-file docs/releases/v1.5.0-alpha.4.md \
            --prerelease --latest=false

      - name: Re-download and verify public updater assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p published
          gh release download v1.5.0-alpha.4 -R "$GITHUB_REPOSITORY" -D published \
            --pattern 'calden-linux-amd64.tar.gz' \
            --pattern 'calden-linux-arm64.tar.gz' \
            --pattern 'SHA256SUMS'
          (cd published && sha256sum -c SHA256SUMS)
          test "$(gh release view v1.5.0-alpha.4 -R "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')" = true
          test "$(gh release view v1.5.0-alpha.4 -R "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = false
