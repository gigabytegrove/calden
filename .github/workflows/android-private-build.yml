name: Temporary encrypted Android build

on:
  push:
    paths:
      - ".github/workflows/android-private-build.yml"

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out CalDen
        uses: actions/checkout@v4

      - name: Generate one-time build key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/calden-build-private.pem
          openssl pkey -in /tmp/calden-build-private.pem -pubout -out /tmp/calden-build-public.pem
          PUBKEY_B64="$(base64 -w0 /tmp/calden-build-public.pem)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/15/comments" -f body="CALDEN_BUILD_PUBKEY:${PUBKEY_B64}"

      - name: Wait for encrypted Android source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          found=0
          for _ in $(seq 1 300); do
            if gh api "repos/${GITHUB_REPOSITORY}/contents/build-bridge/android-payload.txt?ref=main" >/tmp/payload.json 2>/dev/null; then
              jq -r '.content' /tmp/payload.json | tr -d '\n' | base64 -d >/tmp/android-payload.txt
              found=1
              break
            fi
            sleep 2
          done
          if [ "$found" -ne 1 ]; then
            echo "Encrypted Android payload was not received."
            exit 1
          fi

      - name: Decrypt Android source
        run: |
          set -euo pipefail
          : >/tmp/android-source.json
          while IFS= read -r block; do
            [ -z "$block" ] && continue
            printf '%s' "$block" | base64 -d >/tmp/rsa-block.bin
            openssl pkeyutl -decrypt -inkey /tmp/calden-build-private.pem -pkeyopt rsa_padding_mode:pkcs1 -in /tmp/rsa-block.bin >>/tmp/android-source.json
          done </tmp/android-payload.txt
          python3 - <<'PY'
          import base64, json, os
          root = "/tmp/calden-android"
          os.makedirs(root, exist_ok=True)
          with open("/tmp/android-source.json", "r", encoding="utf-8") as fh:
              payload = json.load(fh)
          for item in payload["files"]:
              path = os.path.join(root, item["path"])
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "wb") as out:
                  out.write(base64.b64decode(item["content"]))
          os.chmod(os.path.join(root, "gradlew"), 0o755)
          PY
          rm -f /tmp/rsa-block.bin /tmp/android-source.json /tmp/android-payload.txt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: /tmp/calden-android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          test -s /tmp/calden-android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum /tmp/calden-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calden-android-0.1.0-alpha3
          path: /tmp/calden-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
