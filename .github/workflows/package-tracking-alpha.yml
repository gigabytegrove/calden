name: Alpha 1.5 Package Tracking CI

on:
  push:
    branches: [alpha/v1.5.0-alpha.5]
  pull_request:
    paths:
      - 'internal/api/packages*.go'
      - 'internal/api/package_email*.go'
      - 'internal/api/package_imap*.go'
      - 'internal/api/package_mailbox*.go'
      - 'cmd/calden/main.go'
      - 'internal/store/migrations/04*.sql'
      - 'web/packages.js'
      - 'web/app.js'
      - 'web/index.html'
      - 'web/app.css'
      - 'internal/api/settings.go'
      - 'internal/api/api.go'
      - '.github/workflows/package-tracking.yml'

permissions:
  contents: read

jobs:
  package-tracking:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: calden_ci
          POSTGRES_PASSWORD: calden_ci_only
          POSTGRES_DB: calden_packages_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calden_ci -d calden_packages_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile application and run Go tests
        run: |
          go test ./...
          go vet ./...
      - name: Run PostgreSQL schema and mailbox security integration checks
        env:
          CALDEN_TEST_DATABASE_URL: postgres://calden_ci:calden_ci_only@127.0.0.1:5432/calden_packages_ci?sslmode=disable
        run: go test ./internal/api -run TestPackageDatabaseIntegration -count=1 -v
      - name: Check JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/packages.js
      - name: Run web regression suite
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npm run test:web
