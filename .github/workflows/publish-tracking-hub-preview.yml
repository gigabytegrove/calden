name: Publish Calden Tracking Hub Preview

on:
  push:
    branches: [feature/calden-shared-tracking-hub-20261027]
    paths:
      - 'cmd/calden-tracking-hub/**'
      - 'internal/trackinghub/**'
      - 'Dockerfile.tracking-hub'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/publish-tracking-hub-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: calden-hub-preview
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate standalone central hub binary
        run: |
          gofmt -w cmd/calden-tracking-hub internal/trackinghub
          go test ./internal/trackinghub ./cmd/calden-tracking-hub
          go vet ./internal/trackinghub ./cmd/calden-tracking-hub
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./cmd/calden-tracking-hub
          rm -f calden-tracking-hub
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish central hub (preview; no AfterShip key in image)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.tracking-hub
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/gigabytegrove/calden-tracking-hub:0.1.0-rc1
          labels: |
            org.opencontainers.image.title=Calden Tracking Hub
            org.opencontainers.image.source=https://github.com/gigabytegrove/calden
            org.opencontainers.image.version=0.1.0-rc1
            org.opencontainers.image.revision=${{ github.sha }}
