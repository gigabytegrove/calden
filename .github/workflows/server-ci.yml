      - name: Verify recurring series and single-occurrence exceptions
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import urllib.request
          import urllib.parse

          base = "http://127.0.0.1:8787"

          def request(path, method="GET", payload=None, token=None):
              headers = {"Content-Type": "application/json"}
              if token:
                  headers["Authorization"] = "Bearer " + token
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req) as response:
                  if response.status == 204:
                      return None
                  return json.load(response)

          token = request("/api/login", "POST", {
              "username": "testadmin",
              "password": "test-password-123",
          })["token"]

          calendars = request("/api/calendars", token=token)
          family = next(c for c in calendars if c["name"] == "Family")
          categories = request("/api/categories", token=token)
          medical = next(c for c in categories if c["name"] == "Medical")

          start = (dt.datetime.now(dt.timezone.utc) + dt.timedelta(days=1)).replace(
              hour=14, minute=0, second=0, microsecond=0
          )
          end = start + dt.timedelta(hours=1)

          created = request("/api/events", "POST", {
              "calendar_id": family["id"],
              "category_id": medical["id"],
              "title": "Recurring CI Event",
              "notes": "recurrence verification",
              "location": "Test Room",
              "starts_at": start.isoformat().replace("+00:00", "Z"),
              "ends_at": end.isoformat().replace("+00:00", "Z"),
              "all_day": False,
              "assignee_ids": [],
              "reminders": [],
              "recurrence": {
                  "frequency": "daily",
                  "interval": 1,
                  "weekdays": [],
                  "until": None,
                  "occurrence_count": 4,
              },
          }, token)
          series_id = created["id"]

          window_from = (start - dt.timedelta(hours=1)).isoformat().replace("+00:00", "Z")
          window_to = (start + dt.timedelta(days=5)).isoformat().replace("+00:00", "Z")
          events = request(
              "/api/events?from=" + urllib.parse.quote(window_from) + "&to=" + urllib.parse.quote(window_to),
              token=token,
          )
          series = [e for e in events if e["id"] == series_id]
          assert len(series) == 4, series
          assert all(e["is_recurring"] for e in series), series
          assert all(e["category_id"] == medical["id"] for e in series), series
          assert all(e["color"].lower() == family["color"].lower() for e in series), series
          assert all(e["calendar_color"].lower() == family["color"].lower() for e in series), series
          assert all(e["category_color"].lower() == medical["color"].lower() for e in series), series

          second = series[1]
          original_second = second["occurrence_start"]
          moved_start = start + dt.timedelta(days=1, hours=2)
          moved_end = moved_start + dt.timedelta(hours=1)

          request(f"/api/events/{series_id}/occurrences", "PUT", {
              "original_start": original_second,
              "event": {
                  "calendar_id": family["id"],
                  "category_id": medical["id"],
                  "title": "Moved recurring CI Event",
                  "notes": "one occurrence only",
                  "location": "Moved Room",
                  "starts_at": moved_start.isoformat().replace("+00:00", "Z"),
                  "ends_at": moved_end.isoformat().replace("+00:00", "Z"),
                  "all_day": False,
                  "assignee_ids": [],
                  "reminders": [],
                  "recurrence": None,
              },
          }, token)

          events = request(
              "/api/events?from=" + urllib.parse.quote(window_from) + "&to=" + urllib.parse.quote(window_to),
              token=token,
          )
          series = [e for e in events if e["id"] == series_id]
          assert len(series) == 4, series
          assert not any(e["starts_at"] == original_second for e in series), series
          moved = next(e for e in series if e.get("is_occurrence_override"))
          assert moved["title"] == "Moved recurring CI Event", moved
          assert moved["occurrence_start"] == original_second, moved
          assert moved["category_id"] == medical["id"], moved
          assert moved["color"].lower() == family["color"].lower(), moved
          assert moved["category_color"].lower() == medical["color"].lower(), moved

          third_original = (start + dt.timedelta(days=2)).isoformat().replace("+00:00", "Z")
          request(f"/api/events/{series_id}/occurrences", "DELETE", {
              "original_start": third_original,
          }, token)

          events = request(
              "/api/events?from=" + urllib.parse.quote(window_from) + "&to=" + urllib.parse.quote(window_to),
              token=token,
          )
          series = [e for e in events if e["id"] == series_id]
          assert len(series) == 3, series
          assert not any(e["occurrence_start"] == third_original for e in series), series
          assert any(e["is_occurrence_override"] for e in series), series

          request(f"/api/events/{series_id}", "DELETE", token=token)
          print("Recurring series and single-occurrence exception test passed.")
          PY

      - name: Verify iCalendar recurring import and export
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import urllib.parse
          import urllib.request
          import uuid

          base="http://127.0.0.1:8787"

          def request(path, method="GET", payload=None, token=None, raw=False, content_type="application/json"):
              headers={}
              if token:
                  headers["Authorization"]="Bearer "+token
              data=None
              if payload is not None:
                  if isinstance(payload, (bytes, bytearray)):
                      data=payload
                  else:
                      data=json.dumps(payload).encode()
                  headers["Content-Type"]=content_type
              req=urllib.request.Request(base+path,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req) as response:
                  body=response.read()
                  if raw:
                      return body
                  if not body:
                      return None
                  return json.loads(body)

          token=request("/api/login","POST",{"username":"testadmin","password":"test-password-123"})["token"]
          me=request("/api/me",token=token)
          calendars=request("/api/calendars",token=token)
          family=next(c for c in calendars if c["name"]=="Family")
          medical=next(c for c in request("/api/categories",token=token) if c["name"]=="Medical")

          target_id=request("/api/calendars","POST",{
              "name":"ICS Import Target",
              "color":"#334155",
              "icon":"calendar",
              "description":"CI iCalendar import target",
              "visible_to":[me["id"]],
              "editable_by":[me["id"]],
          },token)["id"]

          start=(dt.datetime.now(dt.timezone.utc)+dt.timedelta(days=8)).replace(hour=15,minute=0,second=0,microsecond=0)
          end=start+dt.timedelta(hours=1)
          created=request("/api/events","POST",{
              "calendar_id":family["id"],
              "category_id":medical["id"],
              "title":"ICS Recurring Source",
              "notes":"export and import verification",
              "location":"Original Place",
              "starts_at":start.isoformat().replace("+00:00","Z"),
              "ends_at":end.isoformat().replace("+00:00","Z"),
              "all_day":False,
              "assignee_ids":[],
              "reminders":[],
              "recurrence":{"frequency":"daily","interval":1,"weekdays":[],"until":None,"occurrence_count":3},
          },token)
          series_id=created["id"]

          original_second=start+dt.timedelta(days=1)
          moved_start=original_second+dt.timedelta(hours=2)
          request(f"/api/events/{series_id}/occurrences","PUT",{
              "original_start":original_second.isoformat().replace("+00:00","Z"),
              "event":{
                  "calendar_id":family["id"],
                  "category_id":medical["id"],
                  "title":"ICS Recurring Source Moved",
                  "notes":"one moved occurrence",
                  "location":"Moved Place",
                  "starts_at":moved_start.isoformat().replace("+00:00","Z"),
                  "ends_at":(moved_start+dt.timedelta(hours=1)).isoformat().replace("+00:00","Z"),
                  "all_day":False,
                  "assignee_ids":[],
                  "reminders":[],
                  "recurrence":None,
              },
          },token)

          ics=request(f"/api/calendars/{family['id']}/export.ics",token=token,raw=True)
          text=ics.decode("utf-8")
          assert "BEGIN:VCALENDAR" in text, text
          assert "RRULE:FREQ=DAILY;COUNT=3" in text, text
          assert "CATEGORIES:Medical" in text, text
          assert "RECURRENCE-ID:" in text, text
          assert "ICS Recurring Source Moved" in text, text

          boundary="----CalDenCIBoundary"+uuid.uuid4().hex
          multipart=(
              f"--{boundary}\r\n"
              'Content-Disposition: form-data; name="calendar"; filename="family.ics"\r\n'
              "Content-Type: text/calendar\r\n\r\n"
          ).encode()+ics+f"\r\n--{boundary}--\r\n".encode()

          first=request(
              f"/api/calendars/{target_id}/import.ics","POST",multipart,token,
              content_type=f"multipart/form-data; boundary={boundary}"
          )
          assert first["created"] >= 1, first
          assert first["exceptions"] >= 1, first

          second=request(
              f"/api/calendars/{target_id}/import.ics","POST",multipart,token,
              content_type=f"multipart/form-data; boundary={boundary}"
          )
          assert second["updated"] >= 1, second

          from_q=urllib.parse.quote((start-dt.timedelta(hours=1)).isoformat().replace("+00:00","Z"))
          to_q=urllib.parse.quote((start+dt.timedelta(days=4)).isoformat().replace("+00:00","Z"))
          imported=request(f"/api/events?from={from_q}&to={to_q}",token=token)
          imported=[e for e in imported if e["calendar_id"]==target_id and e["title"].startswith("ICS Recurring Source")]
          assert len(imported)==3, imported
          assert sum(1 for e in imported if e.get("is_occurrence_override"))==1, imported
          assert all(e["category_name"]=="Medical" for e in imported), imported

          request(f"/api/events/{series_id}","DELETE",token=token)
          print(json.dumps({"first_import":first,"second_import":second,"occurrences":len(imported)},indent=2))
          PY

      - name: Verify complete backup and cold restore
        run: |
          set -euo pipefail

          TOKEN="$(python - <<'PY'
          import json, urllib.request
          req=urllib.request.Request(
              "http://127.0.0.1:8787/api/login",
              data=json.dumps({"username":"testadmin","password":"test-password-123"}).encode(),
              headers={"Content-Type":"application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req) as r:
              print(json.load(r)["token"])
          PY
          )"

          curl -fsS             -H "Authorization: Bearer $TOKEN"             http://127.0.0.1:8787/api/system/backup/download             -o /tmp/calden-restore-test.tar.gz

          tar -tzf /tmp/calden-restore-test.tar.gz > /tmp/calden-backup-contents.txt
          grep -qx 'manifest.json' /tmp/calden-backup-contents.txt
          grep -qx 'calden.dump' /tmp/calden-backup-contents.txt

          curl -fsS             -X PUT             -H "Authorization: Bearer $TOKEN"             -H "Content-Type: application/json"             --data '{"household_name":"Mutated After Backup","timezone":"America/New_York","week_start":"sunday","default_view":7}'             http://127.0.0.1:8787/api/settings/general >/tmp/mutated-settings.json
          grep -q 'Mutated After Backup' /tmp/mutated-settings.json

          curl -fsS             -X POST             -H "Authorization: Bearer $TOKEN"             -F "backup=@/tmp/calden-restore-test.tar.gz"             http://127.0.0.1:8787/api/system/backup/restore >/tmp/staged-restore.json
          grep -q '"staged":true' /tmp/staged-restore.json

          curl -fsS             -X POST             -H "Authorization: Bearer $TOKEN"             -H "Content-Type: application/json"             --data '{}'             http://127.0.0.1:8787/api/system/restart >/tmp/restart.json

          sleep 3
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8787/api/health >/tmp/restored-health.json 2>/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/api/health >/tmp/restored-health.json

          NEW_TOKEN="$(python - <<'PY'
          import json, urllib.request
          req=urllib.request.Request(
              "http://127.0.0.1:8787/api/login",
              data=json.dumps({"username":"testadmin","password":"test-password-123"}).encode(),
              headers={"Content-Type":"application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req) as r:
              print(json.load(r)["token"])
          PY
          )"
          export NEW_TOKEN

          python - <<'PY'
          import json, os, urllib.request
          token=os.environ["NEW_TOKEN"]
          req=urllib.request.Request(
              "http://127.0.0.1:8787/api/settings/general",
              headers={"Authorization":"Bearer "+token},
          )
          with urllib.request.urlopen(req) as r:
              settings=json.load(r)
          assert settings["household_name"] == "Updated Test Family", settings

          req=urllib.request.Request(
              "http://127.0.0.1:8787/api/system/backup/status",
              headers={"Authorization":"Bearer "+token},
          )
          with urllib.request.urlopen(req) as r:
              status=json.load(r)
          assert status["pending"] is False, status
          assert status["last"]["status"] == "success", status
          assert any(b["name"].startswith("pre-restore-") for b in status["backups"]), status
          print(json.dumps({"settings":settings,"restore":status["last"]},indent=2))
          PY
      - name: Stop source-build test stack
        run: docker compose down -v

      - name: Test the actual Docker Raw deployment path
        run: |
          docker compose -p calden-raw-smoke -f docker-compose.dokploy.yml up -d --build
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8787/api/health >/tmp/raw-health.json; then
              cat /tmp/raw-health.json
              exit 0
            fi
            sleep 2
          done
          docker compose -p calden-raw-smoke -f docker-compose.dokploy.yml ps
          docker compose -p calden-raw-smoke -f docker-compose.dokploy.yml logs
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose logs || true
          docker compose -p calden-raw-smoke -f docker-compose.dokploy.yml logs || true

      - name: Stop test stacks
        if: always()
        run: |
          docker compose down -v || true
          docker compose -p calden-raw-smoke -f docker-compose.dokploy.yml down -v || true
