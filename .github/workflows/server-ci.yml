            await categoryForm.locator('input[name="name"]').fill('Travel');
            await categoryForm.locator('input[name="color"]').fill('#0ea5e9');
            await categoryForm.locator('textarea[name="description"]').fill('Trips and travel plans');
            await categoryForm.locator('button[type="submit"]').click();
