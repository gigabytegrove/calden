name: Server CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Resolve dependencies
        run: go mod tidy

      - name: Format Go sources for validation
        run: gofmt -w cmd internal

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./cmd/calden

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Compose files with no environment variables
        run: |
          env -i PATH="$PATH" HOME="$HOME" docker compose -f compose.yaml config >/dev/null
          env -i PATH="$PATH" HOME="$HOME" docker compose -f docker-compose.example.yml config >/dev/null
          env -i PATH="$PATH" HOME="$HOME" docker compose -f docker-compose.dokploy.yml config >/dev/null

      - name: Start a completely blank CalDen install
        run: docker compose up -d --build

      - name: Wait for CalDen
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/api/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Set up browser test
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Verify the first-run wizard in a real browser
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const errors = [];

            page.on('pageerror', err => errors.push('PAGE ERROR: ' + err.message));
            page.on('console', msg => {
              if (msg.type() === 'error') errors.push('CONSOLE ERROR: ' + msg.text());
            });

            await page.goto('http://127.0.0.1:8787', { waitUntil: 'networkidle' });
            await page.locator('#setup-form').waitFor({ state: 'visible' });

            const heading = await page.locator('#setup-form h1').first().textContent();
            if (heading?.trim() !== 'Set up your family calendar') {
              throw new Error('Unexpected setup heading: ' + heading);
            }

            const logoLoaded = await page.locator('.brand-logo').first().evaluate(img =>
              img.complete && img.naturalWidth > 0 && img.naturalHeight > 0
            );
            if (!logoLoaded) throw new Error('Official CalDen logo did not load');

            const bootStatusVisible = await page.locator('#boot-status').isVisible();
            if (bootStatusVisible) {
              throw new Error('Startup status did not clear: ' + await page.locator('#boot-status').textContent());
            }

            if (errors.length) {
              throw new Error(errors.join('\n'));
            }

            console.log('Browser setup wizard smoke test passed.');
            await browser.close();
          })();
          NODE

      - name: Verify first-run state
        run: |
          python - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen("http://127.0.0.1:8787/api/setup/status") as r:
              body=json.load(r)
          assert body["needs_setup"] is True, body
          assert body["setup_version"] == 1, body
          print(body)
          PY

      - name: Complete setup and verify starter calendars
        run: |
          python - <<'PY'
          import json, urllib.request

          base="http://127.0.0.1:8787"
          payload={
              "household_name":"CalDen Test Family",
              "timezone":"America/New_York",
              "display_name":"Test Admin",
              "username":"testadmin",
              "password":"test-password-123",
              "starter_calendars":["family","bills","appointments"],
          }

          req=urllib.request.Request(
              base+"/api/setup",
              data=json.dumps(payload).encode(),
              headers={"Content-Type":"application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req) as r:
              setup=json.load(r)

          token=setup["token"]
          headers={"Authorization":"Bearer "+token}

          req=urllib.request.Request(base+"/api/settings/general",headers=headers)
          with urllib.request.urlopen(req) as r:
              settings=json.load(r)
          assert settings["household_name"] == "CalDen Test Family", settings
          assert settings["timezone"] == "America/New_York", settings

          req=urllib.request.Request(base+"/api/calendars",headers=headers)
          with urllib.request.urlopen(req) as r:
              calendars=json.load(r)

          names={c["name"] for c in calendars}
          assert names == {"Family","Bills","Appointments"}, calendars
          assert all(c["can_edit"] for c in calendars), calendars
          print(json.dumps({"settings":settings,"calendars":calendars},indent=2))
          PY

      - name: Exercise the signed-in product in Chromium
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const errors = [];

            page.on('pageerror', err => errors.push('PAGE ERROR: ' + err.message));
            page.on('console', msg => {
              if (msg.type() === 'error') errors.push('CONSOLE ERROR: ' + msg.text());
            });

            await page.goto('http://127.0.0.1:8787', { waitUntil: 'networkidle' });
            await page.locator('#login-form').waitFor({ state: 'visible' });
            await page.locator('#login-form input[name="username"]').fill('testadmin');
            await page.locator('#login-form input[name="password"]').fill('test-password-123');
            await page.locator('#login-form button[type="submit"]').click();
            await page.locator('#page-calendar').waitFor({ state: 'visible' });

            for (const days of ['1', '7', '14', '30']) {
              await page.locator('.view-switcher button[data-days="' + days + '"]').click();
              if (days === '1' || days === '7') {
                await page.locator('.timeline-wrap').waitFor({ state: 'visible' });
              } else {
                await page.locator('.day-grid').waitFor({ state: 'visible' });
              }
            }

            await page.locator('.nav-item[data-page="people"]').click();
            await page.locator('#page-people').waitFor({ state: 'visible' });
            const form = page.locator('#person-form');
            await form.locator('input[name="display_name"]').fill('Second User');
            await form.locator('input[name="username"]').fill('seconduser');
            await form.locator('input[name="password"]').fill('another-password-123');
            await form.locator('select[name="role"]').selectOption('member');
            await form.locator('button[type="submit"]').click();
            await page.locator('#people-list').getByText('Second User').waitFor({ state: 'visible' });

            await page.locator('.nav-item[data-page="settings"]').click();
            await page.locator('#page-settings').waitFor({ state: 'visible' });
            await page.locator('#general-settings-form input[name="household_name"]').fill('Updated Test Family');
            await page.locator('#general-settings-form button[type="submit"]').click();
            await page.locator('#general-settings-status').getByText('Household settings saved.').waitFor({ state: 'visible' });

            if (errors.length) throw new Error(errors.join('\n'));
            console.log('Signed-in CalDen product smoke test passed.');
            await browser.close();
          })();
          NODE

      - name: Verify recurring series and single-occurrence exceptions
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import urllib.request

          base = "http://127.0.0.1:8787"

          def request(path, method="GET", payload=None, token=None):
              headers = {"Content-Type": "application/json"}
              if token:
                  headers["Authorization"] = "Bearer " + token
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req) as response:
                  if response.status == 204:
                      return None
                  return json.load(response)

          token = request("/api/login", "POST", {
              "username": "testadmin",
              "password": "test-password-123",
          })["token"]

          calendars = request("/api/calendars", token=token)
          family = next(c for c in calendars if c["name"] == "Family")

          start = (dt.datetime.now(dt.timezone.utc) + dt.timedelta(days=1)).replace(
              hour=14, minute=0, second=0, microsecond=0
          )
          end = start + dt.timedelta(hours=1)

          created = request("/api/events", "POST", {
              "calendar_id": family["id"],
              "title": "Recurring CI Event",
              "notes": "recurrence verification",
              "location": "Test Room",
              "starts_at": start.isoformat().replace("+00:00", "Z"),
              "ends_at": end.isoformat().replace("+00:00", "Z"),
              "all_day": False,
              "assignee_ids": [],
              "reminders": [],
              "recurrence": {
                  "frequency": "daily",
                  "interval": 1,
                  "weekdays": [],
                  "until": None,
                  "occurrence_count": 4,
              },
          }, token)
          series_id = created["id"]

          window_from = (start - dt.timedelta(hours=1)).isoformat().replace("+00:00", "Z")
          window_to = (start + dt.timedelta(days=5)).isoformat().replace("+00:00", "Z")
          events = request(
              "/api/events?from=" + urllib.parse.quote(window_from) + "&to=" + urllib.parse.quote(window_to),
              token=token,
          )
          series = [e for e in events if e["id"] == series_id]
          assert len(series) == 4, series
          assert all(e["is_recurring"] for e in series), series

          second = series[1]
          original_second = second["occurrence_start"]
          moved_start = start + dt.timedelta(days=1, hours=2)
          moved_end = moved_start + dt.timedelta(hours=1)

          request(f"/api/events/{series_id}/occurrences", "PUT", {
              "original_start": original_second,
              "event": {
                  "calendar_id": family["id"],
                  "title": "Moved recurring CI Event",
                  "notes": "one occurrence only",
                  "location": "Moved Room",
                  "starts_at": moved_start.isoformat().replace("+00:00", "Z"),
                  "ends_at": moved_end.isoformat().replace("+00:00", "Z"),
                  "all_day": False,
                  "assignee_ids": [],
                  "reminders": [],
                  "recurrence": None,
              },
          }, token)

          events = request(
              "/api/events?from=" + urllib.parse.quote(window_from) + "&to=" + urllib.parse.quote(window_to),
              token=token,
          )
          series = [e for e in events if e["id"] == series_id]
          assert len(series) == 4, series
          assert not any(e["starts_at"] == original_second for e in series), series
          moved = next(e for e in series if e.get("is_occurrence_override"))
          assert moved["title"] == "Moved recurring CI Event", moved
          assert moved["occurrence_start"] == original_second, moved

          third_original = (start + dt.timedelta(days=2)).isoformat().replace("+00:00", "Z")
          request(f"/api/events/{series_id}/occurrences", "DELETE", {
              "original_start": third_original,
          }, token)

          events = request(
              "/api/events?from=" + urllib.parse.quote(window_from) + "&to=" + urllib.parse.quote(window_to),
              token=token,
          )
          series = [e for e in events if e["id"] == series_id]
          assert len(series) == 3, series
          assert not any(e["occurrence_start"] == third_original for e in series), series
          assert any(e["is_occurrence_override"] for e in series), series

          request(f"/api/events/{series_id}", "DELETE", token=token)
          print("Recurring series and single-occurrence exception test passed.")
          PY

      - name: Stop source-build test stack
        run: docker compose down -v

      - name: Test the actual Docker Raw deployment path
        run: |
          docker compose -p calden-raw-smoke -f docker-compose.dokploy.yml up -d --build
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8787/api/health >/tmp/raw-health.json; then
              cat /tmp/raw-health.json
              exit 0
            fi
            sleep 2
          done
          docker compose -p calden-raw-smoke -f docker-compose.dokploy.yml ps
          docker compose -p calden-raw-smoke -f docker-compose.dokploy.yml logs
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose logs || true
          docker compose -p calden-raw-smoke -f docker-compose.dokploy.yml logs || true

      - name: Stop test stacks
        if: always()
        run: |
          docker compose down -v || true
          docker compose -p calden-raw-smoke -f docker-compose.dokploy.yml down -v || true
