            const billRowText = await page.locator('#bill-list .bill-row').filter({ hasText: 'Electric CI Bill' }).innerText();
            if (!billRowText.includes('137.42')) throw new Error('Bill amount was not shown in Bill Pay.');

            // Calendar deletion must allow an explicit destructive override when events exist.
            await page.locator('.nav-item[data-page="calendars"]').click();
            await page.locator('#page-calendars').waitFor({ state: 'visible' });
            const calendarForm = page.locator('#calendar-form');
            await calendarForm.locator('input[name="name"]').fill('Delete Me CI');
            await calendarForm.locator('input[name="color"]').fill('#64748b');
