            await page.locator('.nav-item[data-page="activity"]').click();
            await page.locator('#page-activity').waitFor({ state: 'visible' });
            await page.locator('#activity-list').getByText('Created category Travel', { exact: true }).waitFor({ state: 'visible' });
            await page.locator('#activity-list').getByText('Updated household settings', { exact: true }).waitFor({ state: 'visible' });

            if (errors.length) throw new Error(errors.join('\n'));
            console.log('Signed-in CalDen product smoke test passed.');
            await browser.close();
          })();
          NODE

      - name: Verify event assignment and whole-family notifications
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import urllib.request

          base = "http://127.0.0.1:8787"

          def request(path, method="GET", payload=None, token=None):
              headers = {"Content-Type": "application/json"}
              if token:
                  headers["Authorization"] = "Bearer " + token
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req) as response:
                  if response.status == 204:
                      return None
                  return json.load(response)

          admin_token = request("/api/login", "POST", {
              "username": "testadmin",
              "password": "test-password-123",
          })["token"]
          second_token = request("/api/login", "POST", {
              "username": "seconduser",
              "password": "another-password-123",
          })["token"]

          admin = request("/api/me", token=admin_token)
          users = request("/api/users", token=admin_token)
          second = next(u for u in users if u["username"] == "seconduser")

          created_calendar = request("/api/calendars", "POST", {
              "name": "Notification CI",
              "color": "#2563EB",
              "icon": "calendar",
              "description": "Notification recipient verification",
              "calendar_type": "standard",
              "visible_to": [admin["id"], second["id"]],
              "editable_by": [admin["id"]],
          }, admin_token)
          calendar_id = created_calendar["id"]

          start = (dt.datetime.now(dt.timezone.utc) + dt.timedelta(days=2)).replace(
              hour=15, minute=0, second=0, microsecond=0
          )
          end = start + dt.timedelta(hours=1)
          base_event = {
              "calendar_id": calendar_id,
              "category_id": None,
              "notes": "",
              "location": "",
              "starts_at": start.isoformat().replace("+00:00", "Z"),
              "ends_at": end.isoformat().replace("+00:00", "Z"),
              "all_day": False,
              "reminders": [],
              "recurrence": None,
          }

          request("/api/events", "POST", {
              **base_event,
              "title": "Assigned Notification CI",
              "assignee_ids": [second["id"]],
          }, admin_token)

          notices = request("/api/notifications", token=second_token)
          assigned = next(n for n in notices["items"] if n["title"] == "Assigned Notification CI")
          assert assigned["kind"] == "event_assigned", assigned
          assert assigned["read_at"] is None, assigned
          request(f'/api/notifications/{assigned["id"]}/read', "PUT", token=second_token)

          request("/api/events", "POST", {
              **base_event,
              "title": "Family Notification CI",
              "assignee_ids": [],
          }, admin_token)

          notices = request("/api/notifications", token=second_token)
          family = next(n for n in notices["items"] if n["title"] == "Family Notification CI")
          assert family["kind"] == "event_family", family
          assert notices["unread"] >= 1, notices

          request("/api/notifications/read-all", "PUT", token=second_token)
          notices = request("/api/notifications", token=second_token)
          assert notices["unread"] == 0, notices

          request(f"/api/calendars/{calendar_id}", "DELETE", {
              "force": True,
              "confirmation": "DELETE Notification CI",
          }, admin_token)
          print("Assignment and whole-family notification test passed.")
          PY

      - name: Verify recurring series and single-occurrence exceptions
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import urllib.request
          import urllib.parse

          base = "http://127.0.0.1:8787"

          def request(path, method="GET", payload=None, token=None):
              headers = {"Content-Type": "application/json"}
              if token:
                  headers["Authorization"] = "Bearer " + token
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req) as response:
                  if response.status == 204:
                      return None
                  return json.load(response)

          token = request("/api/login", "POST", {
              "username": "testadmin",
              "password": "test-password-123",
          })["token"]

          calendars = request("/api/calendars", token=token)
          family = next(c for c in calendars if c["name"] == "Family")
          categories = request("/api/categories", token=token)
          medical = next(c for c in categories if c["name"] == "Medical")

          start = (dt.datetime.now(dt.timezone.utc) + dt.timedelta(days=1)).replace(
              hour=14, minute=0, second=0, microsecond=0
          )
          end = start + dt.timedelta(hours=1)

          created = request("/api/events", "POST", {
              "calendar_id": family["id"],
              "category_id": medical["id"],
              "title": "Recurring CI Event",
              "notes": "recurrence verification",
              "location": "Test Room",
              "starts_at": start.isoformat().replace("+00:00", "Z"),
              "ends_at": end.isoformat().replace("+00:00", "Z"),
              "all_day": False,
              "assignee_ids": [],
              "reminders": [],
              "recurrence": {
                  "frequency": "daily",
                  "interval": 1,
                  "weekdays": [],
                  "until": None,
                  "occurrence_count": 4,
              },
          }, token)
          series_id = created["id"]

          window_from = (start - dt.timedelta(hours=1)).isoformat().replace("+00:00", "Z")
          window_to = (start + dt.timedelta(days=5)).isoformat().replace("+00:00", "Z")
          events = request(
              "/api/events?from=" + urllib.parse.quote(window_from) + "&to=" + urllib.parse.quote(window_to),
              token=token,
          )
          series = [e for e in events if e["id"] == series_id]
          assert len(series) == 4, series
          assert all(e["is_recurring"] for e in series), series
          assert all(e["category_id"] == medical["id"] for e in series), series
          assert all(e["color"].lower() == family["color"].lower() for e in series), series
          assert all(e["calendar_color"].lower() == family["color"].lower() for e in series), series
          assert all(e["category_color"].lower() == medical["color"].lower() for e in series), series

          second = series[1]
          original_second = second["occurrence_start"]
          moved_start = start + dt.timedelta(days=1, hours=2)
          moved_end = moved_start + dt.timedelta(hours=1)

          request(f"/api/events/{series_id}/occurrences", "PUT", {
              "original_start": original_second,
              "event": {
                  "calendar_id": family["id"],
                  "category_id": medical["id"],
                  "title": "Moved recurring CI Event",
                  "notes": "one occurrence only",
                  "location": "Moved Room",
                  "starts_at": moved_start.isoformat().replace("+00:00", "Z"),
                  "ends_at": moved_end.isoformat().replace("+00:00", "Z"),
                  "all_day": False,
                  "assignee_ids": [],
                  "reminders": [],
                  "recurrence": None,
              },
          }, token)

          events = request(
              "/api/events?from=" + urllib.parse.quote(window_from) + "&to=" + urllib.parse.quote(window_to),
              token=token,
          )
          series = [e for e in events if e["id"] == series_id]
          assert len(series) == 4, series
          assert not any(e["starts_at"] == original_second for e in series), series
          moved = next(e for e in series if e.get("is_occurrence_override"))
          assert moved["title"] == "Moved recurring CI Event", moved
          assert moved["occurrence_start"] == original_second, moved
          assert moved["category_id"] == medical["id"], moved
          assert moved["color"].lower() == family["color"].lower(), moved
          assert moved["category_color"].lower() == medical["color"].lower(), moved

          third_original = (start + dt.timedelta(days=2)).isoformat().replace("+00:00", "Z")
          request(f"/api/events/{series_id}/occurrences", "DELETE", {
              "original_start": third_original,
          }, token)

          events = request(
              "/api/events?from=" + urllib.parse.quote(window_from) + "&to=" + urllib.parse.quote(window_to),
              token=token,
          )
          series = [e for e in events if e["id"] == series_id]
          assert len(series) == 3, series
          assert not any(e["occurrence_start"] == third_original for e in series), series
          assert any(e["is_occurrence_override"] for e in series), series

          request(f"/api/events/{series_id}", "DELETE", token=token)
          print("Recurring series and single-occurrence exception test passed.")
          PY

      - name: Verify iCalendar recurring import and export
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import urllib.parse
          import urllib.request
          import uuid

          base="http://127.0.0.1:8787"

          def request(path, method="GET", payload=None, token=None, raw=False, content_type="application/json"):
              headers={}
              if token:
                  headers["Authorization"]="Bearer "+token
              data=None
              if payload is not None:
                  if isinstance(payload, (bytes, bytearray)):
                      data=payload
                  else:
                      data=json.dumps(payload).encode()
                  headers["Content-Type"]=content_type
              req=urllib.request.Request(base+path,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req) as response:
                  body=response.read()
                  if raw:
                      return body
                  if not body:
                      return None
                  return json.loads(body)

          token=request("/api/login","POST",{"username":"testadmin","password":"test-password-123"})["token"]
          me=request("/api/me",token=token)
          calendars=request("/api/calendars",token=token)
          family=next(c for c in calendars if c["name"]=="Family")
          medical=next(c for c in request("/api/categories",token=token) if c["name"]=="Medical")

          target_id=request("/api/calendars","POST",{
              "name":"ICS Import Target",
              "color":"#334155",
              "icon":"calendar",
              "description":"CI iCalendar import target",
              "visible_to":[me["id"]],
              "editable_by":[me["id"]],
          },token)["id"]

          start=(dt.datetime.now(dt.timezone.utc)+dt.timedelta(days=8)).replace(hour=15,minute=0,second=0,microsecond=0)
          end=start+dt.timedelta(hours=1)
          created=request("/api/events","POST",{
              "calendar_id":family["id"],
              "category_id":medical["id"],
              "title":"ICS Recurring Source",
              "notes":"export and import verification",
              "location":"Original Place",
              "starts_at":start.isoformat().replace("+00:00","Z"),
              "ends_at":end.isoformat().replace("+00:00","Z"),
              "all_day":False,
              "assignee_ids":[],
              "reminders":[],
              "recurrence":{"frequency":"daily","interval":1,"weekdays":[],"until":None,"occurrence_count":3},
          },token)
          series_id=created["id"]

          original_second=start+dt.timedelta(days=1)
          moved_start=original_second+dt.timedelta(hours=2)
          request(f"/api/events/{series_id}/occurrences","PUT",{
              "original_start":original_second.isoformat().replace("+00:00","Z"),
              "event":{
                  "calendar_id":family["id"],
                  "category_id":medical["id"],
                  "title":"ICS Recurring Source Moved",
                  "notes":"one moved occurrence",
                  "location":"Moved Place",
                  "starts_at":moved_start.isoformat().replace("+00:00","Z"),
                  "ends_at":(moved_start+dt.timedelta(hours=1)).isoformat().replace("+00:00","Z"),
                  "all_day":False,
                  "assignee_ids":[],
                  "reminders":[],
                  "recurrence":None,
              },
          },token)

          ics=request(f"/api/calendars/{family['id']}/export.ics",token=token,raw=True)
          text=ics.decode("utf-8")
          assert "BEGIN:VCALENDAR" in text, text
          assert "RRULE:FREQ=DAILY;COUNT=3" in text, text
          assert "CATEGORIES:Medical" in text, text
          assert "RECURRENCE-ID:" in text, text
          assert "ICS Recurring Source Moved" in text, text

          boundary="----CalDenCIBoundary"+uuid.uuid4().hex
          multipart=(
              f"--{boundary}\r\n"
              'Content-Disposition: form-data; name="calendar"; filename="family.ics"\r\n'
              "Content-Type: text/calendar\r\n\r\n"
          ).encode()+ics+f"\r\n--{boundary}--\r\n".encode()

          first=request(
              f"/api/calendars/{target_id}/import.ics","POST",multipart,token,
              content_type=f"multipart/form-data; boundary={boundary}"
          )
          assert first["created"] >= 1, first
          assert first["exceptions"] >= 1, first

          second=request(
              f"/api/calendars/{target_id}/import.ics","POST",multipart,token,
              content_type=f"multipart/form-data; boundary={boundary}"
          )
          assert second["updated"] >= 1, second

          from_q=urllib.parse.quote((start-dt.timedelta(hours=1)).isoformat().replace("+00:00","Z"))
          to_q=urllib.parse.quote((start+dt.timedelta(days=4)).isoformat().replace("+00:00","Z"))
          imported=request(f"/api/events?from={from_q}&to={to_q}",token=token)
          imported=[e for e in imported if e["calendar_id"]==target_id and e["title"].startswith("ICS Recurring Source")]
          assert len(imported)==3, imported
          assert sum(1 for e in imported if e.get("is_occurrence_override"))==1, imported
          assert all(e["category_name"]=="Medical" for e in imported), imported

          request(f"/api/events/{series_id}","DELETE",token=token)
          print(json.dumps({"first_import":first,"second_import":second,"occurrences":len(imported)},indent=2))
          PY

      - name: Verify Google Calendar multi-calendar migration
        run: |
          python - <<'PY'
          import datetime as dt
          import io
          import json
          import urllib.parse
          import urllib.request
          import uuid
          import zipfile

          base="http://127.0.0.1:8787"

          def json_request(path, method="GET", payload=None, token=None):
              headers={}
              if token:
                  headers["Authorization"]="Bearer "+token
              data=None
              if payload is not None:
                  data=json.dumps(payload).encode()
                  headers["Content-Type"]="application/json"
              req=urllib.request.Request(base+path,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req) as response:
                  body=response.read()
                  return None if not body else json.loads(body)

          def google_multipart(path, archive_payload, token, fields=None):
              boundary="----CalDenGoogleCI"+uuid.uuid4().hex
              body=b""
              for name,value in (fields or {}).items():
                  body+=(
                      f"--{boundary}\r\n"
                      f'Content-Disposition: form-data; name="{name}"\r\n\r\n'
                      f"{value}\r\n"
                  ).encode()
              body+=(
                  f"--{boundary}\r\n"
                  'Content-Disposition: form-data; name="archive"; filename="google-calendar.zip"\r\n'
                  "Content-Type: application/zip\r\n\r\n"
              ).encode()+archive_payload+f"\r\n--{boundary}--\r\n".encode()
              req=urllib.request.Request(
                  base+path,
                  data=body,
                  headers={
                      "Authorization":"Bearer "+token,
                      "Content-Type":f"multipart/form-data; boundary={boundary}",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          token=json_request("/api/login","POST",{"username":"testadmin","password":"test-password-123"})["token"]

          now=dt.datetime.now(dt.timezone.utc)
          next_month=(now.replace(day=1)+dt.timedelta(days=32)).replace(day=1,hour=14,minute=0,second=0,microsecond=0)
          first_monday=next_month+dt.timedelta(days=(7-next_month.weekday())%7)
          end=first_monday+dt.timedelta(hours=1)
          family_day=first_monday+dt.timedelta(days=10)

          personal=(
              "BEGIN:VCALENDAR\r\n"
              "VERSION:2.0\r\n"
              "X-WR-CALNAME:Google Personal\r\n"
              "BEGIN:VEVENT\r\n"
              "UID:google-first-monday@test\r\n"
              f"DTSTART:{first_monday.strftime('%Y%m%dT%H%M%SZ')}\r\n"
              f"DTEND:{end.strftime('%Y%m%dT%H%M%SZ')}\r\n"
              "SUMMARY:Google First Monday\r\n"
              "LOCATION:Imported Room\r\n"
              "RRULE:FREQ=MONTHLY;COUNT=3;BYDAY=1MO\r\n"
              "END:VEVENT\r\n"
              "END:VCALENDAR\r\n"
          )
          shared=(
              "BEGIN:VCALENDAR\r\n"
              "VERSION:2.0\r\n"
              "X-WR-CALNAME:Google Shared\r\n"
              "BEGIN:VEVENT\r\n"
              "UID:google-shared-day@test\r\n"
              f"DTSTART;VALUE=DATE:{family_day.strftime('%Y%m%d')}\r\n"
              f"DTEND;VALUE=DATE:{(family_day+dt.timedelta(days=1)).strftime('%Y%m%d')}\r\n"
              "SUMMARY:Google Shared Day\r\n"
              "END:VEVENT\r\n"
              "END:VCALENDAR\r\n"
          )

          archive=io.BytesIO()
          with zipfile.ZipFile(archive,"w",zipfile.ZIP_DEFLATED) as z:
              z.writestr("Takeout/Calendar/Google Personal.ics",personal)
              z.writestr("Takeout/Calendar/Google Shared.ics",shared)
          payload=archive.getvalue()

          first=google_multipart("/api/integrations/google/import",payload,token,{"reuse_by_name":"true"})
          assert first["calendar_count"] == 2, first
          assert first["created_calendars"] == 2, first
          assert first["created"] == 2, first

          second=google_multipart("/api/integrations/google/import",payload,token,{"reuse_by_name":"true"})
          assert second["calendar_count"] == 2, second
          assert second["reused_calendars"] == 2, second
          assert second["updated"] == 2, second

          calendars=json_request("/api/calendars",token=token)
          names={c["name"] for c in calendars}
          assert {"Google Personal","Google Shared"}.issubset(names), calendars

          from_q=urllib.parse.quote((first_monday-dt.timedelta(days=1)).isoformat().replace("+00:00","Z"))
          to_q=urllib.parse.quote((first_monday+dt.timedelta(days=100)).isoformat().replace("+00:00","Z"))
          events=json_request(f"/api/events?from={from_q}&to={to_q}",token=token)
          monday=[e for e in events if e["title"]=="Google First Monday"]
          assert len(monday) == 3, monday
          assert all(e["recurrence"]["raw"]=="FREQ=MONTHLY;COUNT=3;BYDAY=1MO" for e in monday), monday

          # Reproduce the alpha6 failure mode: force Google "Family Calendar" into its own
          # auto-created calendar even though CalDen already has "Family".
          repair_day=family_day+dt.timedelta(days=2)
          repair_ics=(
              "BEGIN:VCALENDAR\r\n"
              "VERSION:2.0\r\n"
              "X-WR-CALNAME:Family Calendar\r\n"
              "BEGIN:VEVENT\r\n"
              "UID:google-family-repair@test\r\n"
              f"DTSTART;VALUE=DATE:{repair_day.strftime('%Y%m%d')}\r\n"
              f"DTEND;VALUE=DATE:{(repair_day+dt.timedelta(days=1)).strftime('%Y%m%d')}\r\n"
              "SUMMARY:Family Import Repair Event\r\n"
              "END:VEVENT\r\n"
              "END:VCALENDAR\r\n"
          )
          repair_path="Takeout/Calendar/Family Calendar.ics"
          repair_archive=io.BytesIO()
          with zipfile.ZipFile(repair_archive,"w",zipfile.ZIP_DEFLATED) as z:
              z.writestr(repair_path,repair_ics)
          repair_payload=repair_archive.getvalue()
          external_id=repair_path.lower()

          forced=google_multipart(
              "/api/integrations/google/import",
              repair_payload,
              token,
              {"calendar_mapping":json.dumps({external_id:"__create__"})},
          )
          assert forced["created_calendars"] == 1, forced
          calendars=json_request("/api/calendars",token=token)
          assert any(c["name"]=="Family Calendar" for c in calendars), calendars
          family=next(c for c in calendars if c["name"]=="Family")

          preview=google_multipart("/api/integrations/google/preview",repair_payload,token)
          assert preview["calendar_count"] == 1, preview
          match=preview["calendars"][0]
          assert match["previous_auto_created"] is True, match
          assert match["suggested_calendar_id"] == family["id"], match
          assert match["match_score"] >= 80, match

          repaired=google_multipart(
              "/api/integrations/google/import",
              repair_payload,
              token,
              {"calendar_mapping":json.dumps({external_id:family["id"]})},
          )
          assert repaired["created_calendars"] == 0, repaired
          assert repaired["cleaned_calendars"] == 1, repaired
          calendars=json_request("/api/calendars",token=token)
          assert not any(c["name"]=="Family Calendar" for c in calendars), calendars

          repair_from=urllib.parse.quote((repair_day-dt.timedelta(days=1)).isoformat().replace("+00:00","Z"))
          repair_to=urllib.parse.quote((repair_day+dt.timedelta(days=2)).isoformat().replace("+00:00","Z"))
          repaired_events=json_request(f"/api/events?from={repair_from}&to={repair_to}",token=token)
          repaired_events=[e for e in repaired_events if e["title"]=="Family Import Repair Event"]
          assert len(repaired_events) == 1, repaired_events
          assert repaired_events[0]["calendar_id"] == family["id"], repaired_events

          print(json.dumps({
              "first":first,
              "second":second,
              "advanced_occurrences":len(monday),
              "preview_match":match,
              "repair":repaired,
          },indent=2))
          PY

      - name: Verify complete backup and cold restore
        run: |
          set -euo pipefail

          TOKEN="$(python - <<'PY'
          import json, urllib.request
          req=urllib.request.Request(
              "http://127.0.0.1:8787/api/login",
              data=json.dumps({"username":"testadmin","password":"test-password-123"}).encode(),
              headers={"Content-Type":"application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req) as r:
              print(json.load(r)["token"])
          PY
          )"

          curl -fsS             -H "Authorization: Bearer $TOKEN"             http://127.0.0.1:8787/api/system/backup/download             -o /tmp/calden-restore-test.tar.gz

          tar -tzf /tmp/calden-restore-test.tar.gz > /tmp/calden-backup-contents.txt
          grep -qx 'manifest.json' /tmp/calden-backup-contents.txt
          grep -qx 'calden.dump' /tmp/calden-backup-contents.txt

          curl -fsS             -X PUT             -H "Authorization: Bearer $TOKEN"             -H "Content-Type: application/json"             --data '{"household_name":"Mutated After Backup","timezone":"America/New_York","week_start":"sunday","default_view":7}'             http://127.0.0.1:8787/api/settings/general >/tmp/mutated-settings.json
          grep -q 'Mutated After Backup' /tmp/mutated-settings.json

          curl -fsS             -X POST             -H "Authorization: Bearer $TOKEN"             -F "backup=@/tmp/calden-restore-test.tar.gz"             http://127.0.0.1:8787/api/system/backup/restore >/tmp/staged-restore.json
          grep -q '"staged":true' /tmp/staged-restore.json

          curl -fsS             -X POST             -H "Authorization: Bearer $TOKEN"             -H "Content-Type: application/json"             --data '{}'             http://127.0.0.1:8787/api/system/restart >/tmp/restart.json

          sleep 3
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8787/api/health >/tmp/restored-health.json 2>/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/api/health >/tmp/restored-health.json

          NEW_TOKEN="$(python - <<'PY'
          import json, urllib.request
          req=urllib.request.Request(
              "http://127.0.0.1:8787/api/login",
              data=json.dumps({"username":"testadmin","password":"test-password-123"}).encode(),
              headers={"Content-Type":"application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req) as r:
              print(json.load(r)["token"])
          PY
          )"
          export NEW_TOKEN

          python - <<'PY'
          import json, os, urllib.request
          token=os.environ["NEW_TOKEN"]
          req=urllib.request.Request(
              "http://127.0.0.1:8787/api/settings/general",
              headers={"Authorization":"Bearer "+token},
          )
          with urllib.request.urlopen(req) as r:
              settings=json.load(r)
          assert settings["household_name"] == "Updated Test Family", settings

          req=urllib.request.Request(
              "http://127.0.0.1:8787/api/system/backup/status",
              headers={"Authorization":"Bearer "+token},
          )
          with urllib.request.urlopen(req) as r:
              status=json.load(r)
          assert status["pending"] is False, status
          assert status["last"]["status"] == "success", status
          assert any(b["name"].startswith("pre-restore-") for b in status["backups"]), status
          print(json.dumps({"settings":settings,"restore":status["last"]},indent=2))
          PY
