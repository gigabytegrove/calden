            if (!avatarPreviewLoaded) throw new Error('Profile image preview did not load');
            await form.locator('button[type="submit"]').click();
            await page.locator('#people-list').getByText('Second User').waitFor({ state: 'visible' });

            await page.locator('.nav-item[data-page="bills"]').click();
            await page.locator('#page-bills').waitFor({ state: 'visible' });
            await page.locator('#add-bill').click();
            await page.locator('#bill-event-details').waitFor({ state: 'visible' });
            await eventForm.locator('input[name="title"]').fill('Electric CI Bill');
            await eventForm.locator('input[name="bill_amount"]').fill('137.42');
