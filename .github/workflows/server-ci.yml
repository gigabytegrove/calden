            await page.locator('[data-settings-pane="calendar"]').waitFor({ state: 'visible' });
            await page.locator('#settings-default-duration').selectOption('90');
            await page.locator('#settings-scroll-now').uncheck();
            await page.locator('#display-settings-form button[type="submit"]').click();
            await page.locator('#display-settings-status').getByText('Display settings saved.').waitFor({ state: 'visible' });
            await page.locator('.settings-nav-item[data-settings-tab="account"]').click();
            await page.locator('[data-settings-pane="account"]').waitFor({ state: 'visible' });
