            await eventForm.locator('button[type="submit"]').click();
            await page.locator('#event-dialog').waitFor({ state: 'hidden' });

            await page.locator('#calendar-search').fill('Web UI CI Event');
            await page.locator('#calendar-view').getByText('Web UI CI Event', { exact: true }).waitFor({ state: 'visible' });
            await page.locator('#clear-calendar-filters').click();

            await page.locator('.nav-item[data-page="notifications"]').click();
