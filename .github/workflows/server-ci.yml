name: Server CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Resolve dependencies
        run: go mod tidy

      - name: Check formatting
        run: |
          test -z "$(gofmt -l cmd internal)" || {
            echo "These Go files need gofmt:"
            gofmt -l cmd internal
            exit 1
          }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./cmd/calden
