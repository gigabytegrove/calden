name: Calden Central Tracking Hub — Secure Integration

on:
  push:
    branches: [feature/calden-shared-tracking-hub-20261027]
  pull_request:

permissions:
  contents: read

jobs:
  verify-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calden_test
          POSTGRES_PASSWORD: calden_test_only
          POSTGRES_DB: calden_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U calden_test -d calden_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Go tests, formatting and static analysis
        run: |
          set -euo pipefail
          gofmt -w cmd/calden-tracking-hub internal/trackinghub internal/api/package_hub_client.go internal/api/package_hub_client_test.go
          export PGPASSWORD=calden_test_only
          psql -h 127.0.0.1 -U calden_test -d calden_test -c "CREATE DATABASE calden_hub_test"
          psql -h 127.0.0.1 -U calden_test -d calden_test -c "CREATE DATABASE calden_api_test"
          CALDEN_TEST_DATABASE_URL=postgres://calden_test:calden_test_only@127.0.0.1:5432/calden_hub_test?sslmode=disable go test -race ./internal/trackinghub -count=1
          CALDEN_TEST_DATABASE_URL=postgres://calden_test:calden_test_only@127.0.0.1:5432/calden_api_test?sslmode=disable go test -race ./internal/api -count=1
          go test ./... 
          go vet ./...
          go build -o /tmp/calden-tracking-hub ./cmd/calden-tracking-hub
          go build -o /tmp/calden ./cmd/calden
      - name: Web and existing alpha regressions
        run: |
          npm install --no-audit --no-fund
          npm run build:css
          npm run test:web
          node --check web/packages.js
      - name: Validate hub container
        run: |
          docker build -f Dockerfile.tracking-hub -t calden-tracking-hub:test .
          test "$(docker image inspect calden-tracking-hub:test --format '{{.Config.User}}')" = "calden"
      - name: Reject leaked bundled AfterShip key
        run: |
          ! grep -r -E 'as-api-key:[[:space:]]*[A-Za-z0-9]{16}' web cmd/calden-tracking-hub internal/trackinghub
