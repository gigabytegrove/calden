name: Publish CalDen Container

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  statuses: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Resolve dependencies
        run: go mod tidy

      - name: Compile CalDen before container build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          BUILD_OUTPUT="$(go build ./cmd/calden 2>&1)"
          BUILD_RC=$?
          set -e
          printf '%s\n' "$BUILD_OUTPUT"
          if [ "$BUILD_RC" -ne 0 ]; then
            MESSAGE="$(printf '%s\n' "$BUILD_OUTPUT" | tail -n 1 | tr '\n' ' ' | cut -c1-130)"
            jq -n               --arg state "failure"               --arg context "calden-compile-diagnostic"               --arg description "$MESSAGE"               '{state:$state,context:$context,description:$description}' > /tmp/status.json
            curl --fail-with-body -sS               -X POST               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"               --data-binary @/tmp/status.json || true
            exit "$BUILD_RC"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish CalDen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/gigabytegrove/calden:latest
            ghcr.io/gigabytegrove/calden:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=CalDen
            org.opencontainers.image.description=A family calendar and scheduling system you control.
            org.opencontainers.image.source=https://github.com/gigabytegrove/calden
            org.opencontainers.image.revision=${{ github.sha }}
