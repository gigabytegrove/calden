name: Validate CalDen Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/android-bridge.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Android source
        uses: actions/checkout@v4
        with:
          repository: gigabytegrove/calden-android
          path: calden-android
          token: ${{ github.token }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Android debug APK
        working-directory: calden-android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          test -s calden-android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum calden-android/app/build/outputs/apk/debug/app-debug.apk
